---
- name: Verify data_disk_device is defined before disk operations
  ansible.builtin.assert:
    that:
      - data_disk_device is defined
      - data_disk_device | length > 0
    fail_msg: >
      'data_disk_device' is undefined. Set it in the inventory (e.g. via persistent /dev/disk/by-id/... path)
      or via 'terraform -chdir=terraform/aws-poc output -raw data_disk_device'.

- name: Ensure {{ storage_filesystem_type }} filesystem exists on the data disk
  community.general.filesystem:
    fstype: "{{ storage_filesystem_type }}"
    dev: "{{ data_disk_device }}"

- name: Create mount point directory for K3s app data
  ansible.builtin.file:
    path: "{{ storage_mount_point }}"
    state: directory
    mode: '0755' # Sets standard directory permissions (rwxr-xr-x)

- name: Protect the directory underneath {{ storage_mount_point }} (chattr +i)
  block:
    - name: Create temporary view directory for the root filesystem
      ansible.builtin.command: mktemp -d /run/storage-guard.XXXXXX
      register: storage_rootfs_view
      changed_when: false
      check_mode: false

    - name: Bind-mount the root filesystem without submounts
      ansible.builtin.command: "mount --bind / {{ storage_rootfs_view.stdout }}"
      register: storage_rootfs_bind
      changed_when: false
      check_mode: false

    - name: Read attributes of the hidden mount point directory
      ansible.builtin.stat:
        path: "{{ storage_rootfs_view.stdout }}{{ storage_mount_point }}"
      register: storage_hidden_dir

    - name: Set immutable flag on the hidden mount point directory
      ansible.builtin.command: "chattr +i {{ storage_rootfs_view.stdout }}{{ storage_mount_point }}"
      when: "'i' not in storage_hidden_dir.stat.attr_flags"

  always:
    - name: Unmount root filesystem view
      ansible.builtin.command: "umount {{ storage_rootfs_view.stdout }}"
      changed_when: false
      check_mode: false
      when: storage_rootfs_bind is defined and storage_rootfs_bind is succeeded

    - name: Remove temporary view directory
      ansible.builtin.command: "rmdir {{ storage_rootfs_view.stdout }}"
      changed_when: false
      check_mode: false
      when: storage_rootfs_view is succeeded

- name: Add volume to /etc/fstab and mount it
  ansible.posix.mount:
    path: "{{ storage_mount_point }}"
    src: "{{ data_disk_device }}"
    fstype: "{{ storage_filesystem_type }}"
    opts: "{{ storage_volume_options }}"
    passno: "2" # fsck before mounting; an unrepairable filesystem keeps the mount (and K3s) down
    state: mounted # Ensures the volume is both currently mounted AND added to fstab for reboot persistence