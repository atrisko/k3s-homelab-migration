---

- name: Install essential system tools
  ansible.builtin.apt:
    name: "{{ os_base_packages }}"
    update_cache: yes
    cache_valid_time: 3600 # Prevents running 'apt-get update' again if already run within the last hour
    state: present # Ensures packages exist; does nothing if they are already installed

- name: Enable unattended-upgrades
  ansible.builtin.debconf:
    name: unattended-upgrades
    question: unattended-upgrades/enable_auto_updates
    value: "true"
    vtype: boolean

# Configure which updates to apply automatically
- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      // Automatically install security updates only
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename},label=Debian-Security";
      };

      // Packages to never update automatically
      Unattended-Upgrade::Package-Blacklist {
          "linux-image*";
          "linux-headers*";
      };

      // Send email notifications about updates
      //Unattended-Upgrade::Mail "{{ os_mail }}";
      //Unattended-Upgrade::MailReport "on-change";

      // Automatically remove unused dependencies
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";

      // Automatically reboot if required (set time for maintenance window)
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ os_reboot_time }}";

      // Limit download bandwidth (in kb/sec, 0 = unlimited)
      Acquire::http::Dl-Limit "{{ os_download_limit }}";
    mode: '0644'
    owner: root
    group: root

# Configure how often updates are checked and applied
- name: Configure auto-update schedule
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "{{ os_auto_clean_days }}";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'
    owner: root
    group: root

- name: Ensure apt daily upgrade timers are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Check for ifupdown configuration directory
  ansible.builtin.stat:
    path: /etc/network/interfaces.d
  register: ifupdown_dir

- name: Check for netplan configuration directory
  ansible.builtin.stat:
    path: /etc/netplan
  register: netplan_dir

- name: Ensure persistent IPv6 ULA configuration exists in Debian (ifupdown / RemoteLab)
  ansible.builtin.copy:
    dest: /etc/network/interfaces.d/60-ula.cfg
    owner: root
    group: root
    mode: '0644'
    content: |
      # Persistent ULA according to ADR-0001
      iface {{ ansible_facts['default_ipv4']['interface'] }} inet6 static
          address {{ os_ipv6_ula }}
          accept_ra 2
          autoconf 1
  when: ifupdown_dir.stat.exists and ifupdown_dir.stat.isdir

- name: Ensure persistent IPv6 ULA configuration exists (netplan / Cloud AMI)
  ansible.builtin.copy:
    dest: /etc/netplan/60-ula.yaml
    owner: root
    group: root
    mode: '0600'
    content: |
      # Persistent ULA according to ADR-0001
      network:
        version: 2
        ethernets:
          {{ ansible_facts['default_ipv4']['interface'] }}:
            addresses:
              - "{{ os_ipv6_ula }}"
  when: netplan_dir.stat.exists and netplan_dir.stat.isdir


- name: Apply ULA immediately (runtime)
  ansible.builtin.command:
    cmd: "ip -6 addr replace {{ os_ipv6_ula }} dev {{ ansible_facts['default_ipv4']['interface'] }}"
  when: os_ipv6_ula.split('/')[0] not in (ansible_facts['all_ipv6_addresses'] | default([]))

- name: Refresh network facts after IPv6 change
  ansible.builtin.setup:
    gather_subset:
      - network
      - all_ipv6_addresses

- name: Configure hardened OpenSSH daemon settings
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      # OpenSSH Daemon Hardening Baseline (First match wins)
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      KbdInteractiveAuthentication no
      MaxAuthTries 3
      X11Forwarding no
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
      AllowAgentForwarding no
      AllowUsers {{ ansible_user }}

    owner: root
    group: root
    mode: '0644'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: restart ssh

- name: Configure hardened sysctl parameters for Kubernetes host
  ansible.builtin.copy:
    src: 99-kubernetes-hardening.conf
    dest: /etc/sysctl.d/99-kubernetes-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: reload sysctl

- name: Ensure systemd-journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure journald log volume limits
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/00-limits.conf
    content: |
      [Journal]
      # Cap total disk space used by systemd journal to prevent K8s DiskPressure
      SystemMaxUse={{ os_systemd_max_usage }}
      SystemMaxFileSize={{ os_systemd_max_file_size }}
      MaxRetentionSec={{ os_systemd_max_retention_sec }}
      ForwardToSyslog={{ os_systemd_forward_to_syslog }}
    owner: root
    group: root
    mode: '0644'
  notify: restart systemd-journald

- name: Blacklist legacy and unused kernel modules
  ansible.builtin.copy:
    src: 99-hardening-blacklist.conf
    dest: /etc/modprobe.d/99-hardening-blacklist.conf
    owner: root
    group: root
    mode: '0644'

- name: Ensure systemd-timesyncd is enabled and running
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: yes

- name: Configure hardened sudo defaults
  ansible.builtin.copy:
    dest: /etc/sudoers.d/00-hardening
    content: |
      # Prevent terminal hijacking via TIOCSTI ioctl injection
      Defaults use_pty
      # Log administrative commands for auditability
      Defaults logfile="/var/log/sudo.log"
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'

- name: Configure passwordless sudo for Ansible administrator user
  ansible.builtin.copy:
    dest: /etc/sudoers.d/10-ansible
    content: |
      # Allow passwordless sudo for non-interactive Ansible automation and CI/CD pipelines
      {{ ansible_user }} ALL=(ALL) NOPASSWD: ALL
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'













