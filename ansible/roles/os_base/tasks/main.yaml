---

- name: Install essential system tools
  ansible.builtin.apt:
    name:
      - curl
      - git
      - htop
      - jq
      - open-iscsi
      - unattended-upgrades
      - apt-listchanges
      - nfs-common # Required later by Kubernetes to mount persistent network storage
    update_cache: yes
    cache_valid_time: 3600 # Prevents running 'apt-get update' again if already run within the last hour
    state: present # Ensures packages exist; does nothing if they are already installed

- name: Enable unattended-upgrades
  ansible.builtin.debconf:
    name: unattended-upgrades
    question: unattended-upgrades/enable_auto_updates
    value: "true"
    vtype: boolean

# Configure which updates to apply automatically
- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      // Automatically install security updates only
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename},label=Debian-Security";
      };

      // Packages to never update automatically
      Unattended-Upgrade::Package-Blacklist {
          "linux-image*";
          "linux-headers*";
      };

      // Send email notifications about updates
      //Unattended-Upgrade::Mail "alex.trisko@gmail.com";
      //Unattended-Upgrade::MailReport "on-change";

      // Automatically remove unused dependencies
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";

      // Automatically reboot if required (set time for maintenance window)
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "03:00";

      // Limit download bandwidth (in kb/sec, 0 = unlimited)
      Acquire::http::Dl-Limit "0";
    mode: '0644'
    owner: root
    group: root

# Configure how often updates are checked and applied
- name: Configure auto-update schedule
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'
    owner: root
    group: root

- name: Ensure apt daily upgrade timers are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer


- name: Ensure persistent IPv6 ULA configuration exists in Debian
  ansible.builtin.copy:
    dest: /etc/network/interfaces.d/60-ula.cfg
    owner: root
    group: root
    mode: '0644'
    content: |
      # Persistent ULA according to ADR-0001
      iface {{ ansible_facts['default_ipv4']['interface'] }} inet6 static
          address fd85:cc6d:b16f:30::10/64
          accept_ra 2
          autoconf 1

- name: Apply ULA immediately (runtime)
  ansible.builtin.command:
    cmd: "ip -6 addr replace fd85:cc6d:b16f:30::10/64 dev {{ ansible_facts['default_ipv4']['interface'] }}"
  when: "'fd85:cc6d:b16f:30::10' not in (ansible_facts['all_ipv6_addresses'] | default([]))"

- name: Refresh network facts after IPv6 change
  ansible.builtin.setup:
    gather_subset:
      - network
      - all_ipv6_addresses

- name: Configure hardened OpenSSH daemon settings
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      # OpenSSH Daemon Hardening Baseline (First match wins)
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      KbdInteractiveAuthentication no
      MaxAuthTries 3
      X11Forwarding no
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
      AllowAgentForwarding no
      AllowUsers {{ ansible_user }}

    owner: root
    group: root
    mode: '0644'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: restart ssh

- name: Configure hardened sysctl parameters for Kubernetes host
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-hardening.conf
    content: |
      # Network Anti-Spoofing & ICMP (Loose mode for CNI/Flannel compatibility)
      net.ipv4.conf.all.rp_filter = 2
      net.ipv4.conf.default.rp_filter = 2
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv4.tcp_syncookies = 1

      # Required for Kubernetes & Flannel routing (IPv4 + IPv6 ULA)
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1

      # Kernel Memory & Address Protection
      kernel.dmesg_restrict = 1
      kernel.kptr_restrict = 2
      fs.suid_dumpable = 0
      fs.protected_hardlinks = 1
      fs.protected_symlinks = 1

      # Resource Limits for Container Workloads
      fs.inotify.max_user_watches = 524288
      fs.inotify.max_user_instances = 8192
    owner: root
    group: root
    mode: '0644'
  notify: reload sysctl






