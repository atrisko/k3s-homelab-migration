---
- name: Ensure K3s library directory exists
  ansible.builtin.file:
    path: /usr/local/lib/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'


- name: Download K3s installation script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh
    dest: /usr/local/lib/k3s/install.sh
    mode: '0755'
    checksum: "{{ k3s_install_script_checksum }}"


- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Verify that the node has its ULA assigned (ADR-0001)
  ansible.builtin.assert:
    that:
      - (node_ipv6_ula | ansible.utils.ipaddr('address')) in (ansible_facts['all_ipv6_addresses'] | default([]))
    fail_msg: "Node does not have ULA {{ node_ipv6_ula | ansible.utils.ipaddr('address') }} assigned. Configure networking (os_base) first."

- name: Verify that the node has its configured IPv4 assigned
  ansible.builtin.assert:
    that:
      - (node_ipv4 | ansible.utils.ipaddr('address')) in (ansible_facts['all_ipv4_addresses'] | default([]))
    fail_msg: "Node does not have IPv4 {{ node_ipv4 | ansible.utils.ipaddr('address') }} assigned."

- name: Refresh mount facts after storage_poc role execution
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - 'mounts'

- name: Verify that {{ k3s_storage_path }} is an active mountpoint to prevent root-disk overflow
  ansible.builtin.assert:
    that:
      - ansible_facts['mounts'] | selectattr('mount', 'equalto', k3s_storage_path) | list | length > 0
    fail_msg: "{{ k3s_storage_path }} is not mounted! K3s local-path provisioner would write directly to the root disk."

- name: ensure config directory for k3s exists
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write config file to safe-guard against k3s writing onto root disk
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/02-storage.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      RequiresMountsFor={{ k3s_storage_path }}
  notify: Restart k3s

- name: Write K3s config.yaml for Dual-Stack and Storage
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0644'
    content: |
      # Dual-Stack: IPv4 (10.42.x.x) / IPv6 ULAs (fd85:cc6d:b16f::) according to ADR-0001
      cluster-cidr: "{{ k3s_cluster_cidr }}"
      service-cidr: "{{ k3s_service_cidr }}"
      flannel-ipv6-masq: {{ k3s_flannel_ipv6_masq | bool | lower }}
      
      # Force the node to use both IPs (IPv4 + static ULA) per ADR-0001
      node-ip: "{{ node_ipv4 | ansible.utils.ipaddr('address') }},{{ node_ipv6_ula | ansible.utils.ipaddr('address') }}"
      
      # Storage: Dedicated path for Persistent Volumes
      default-local-storage-path: "{{ k3s_storage_path }}"

      {% if k3s_tls_san | length > 0 %}
      # Additional Subject Alternative Names for remote API access
      tls-san:
      {% for san in k3s_tls_san %}
        - "{{ san }}"
      {% endfor %}
      {% endif %}
  notify: Restart k3s

- name: Ensure K3s auto-deploy manifests directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    owner: root
    group: root
    # 0700 standard directory permissions for internal K3s manifests
    mode: '0700'

- name: Deploy ArgoCD HelmChart manifest for K3s auto-deploy
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/argocd.yaml
    owner: root
    group: root
    mode: '0644'
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: argocd
        namespace: kube-system
      spec:
        repo: https://argoproj.github.io/argo-helm
        chart: argo-cd
        version: "{{ argocd_chart_version }}"
        targetNamespace: argocd
        createNamespace: true


- name: Check currently installed K3s version
  ansible.builtin.command: k3s --version
  register: k3s_check
  changed_when: false
  failed_when: false

- name: Execute K3s installation script
  ansible.builtin.command:
    cmd: /usr/local/lib/k3s/install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_check.rc != 0 or (k3s_check.stdout | regex_search('v\\d\\S*')) != k3s_version



- name: Ensure K3s service is running and enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: yes

- name: Wait for ArgoCD Application CRD to be established
  ansible.builtin.command:
    cmd: k3s kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=30s
  register: crd_wait
  until: crd_wait.rc == 0
  retries: "{{ k3s_argocd_wait_retries }}"
  delay: "{{ k3s_argocd_wait_delay }}"
  changed_when: false

- name: Apply ArgoCD Root Application
  ansible.builtin.command:
    cmd: k3s kubectl apply -f -
    stdin: "{{ lookup('file', playbook_dir + '/../k8s/bootstrap/root-app.yaml') }}"
  register: apply_root_app
  changed_when: "'configured' in apply_root_app.stdout or 'created' in apply_root_app.stdout"

