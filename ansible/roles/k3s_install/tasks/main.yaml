---
- name: Download K3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'

- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Verify that the node has its ULA from ADR-0001
  ansible.builtin.assert:
    that:
      - (ansible_facts['all_ipv6_addresses'] | default([])) | select('match', '^fd85:cc6d:b16f:30::') | list | length > 0
    fail_msg: "Node has no ULA from fd85:cc6d:b16f:30::/64. Configure networking (os_base) first."

- name: Write K3s config.yaml for Dual-Stack and Storage
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0644'
    content: |
      # Dual-Stack: IPv4 (10.42.x.x) / IPv6 ULAs (fd85:cc6d:b16f::) according to ADR-0001
      cluster-cidr: "10.42.0.0/16,fd85:cc6d:b16f:4200::/56"
      service-cidr: "10.43.0.0/16,fd85:cc6d:b16f:4300::/112"
      flannel-ipv6-masq: true
      
      # Force the node to use both IPs (dynamic IPv4 + static ULA) using modern facts syntax
      node-ip: "{{ ansible_facts['default_ipv4']['address'] }},{{ ansible_facts['all_ipv6_addresses'] | select('match', '^fd85:cc6d:b16f:30::') | first }}"
      
      # Storage: Dedicated path for Persistent Volumes
      default-local-storage-path: "/mnt/appdata"

- name: Ensure K3s auto-deploy manifests directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    owner: root
    group: root
    # 0700 is the required secure permission for this internal K3s folder
    mode: '0700'

- name: Deploy ArgoCD HelmChart manifest for K3s auto-deploy
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/argocd.yaml
    owner: root
    group: root
    mode: '0644'
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: argocd
        namespace: kube-system
      spec:
        repo: https://argoproj.github.io/argo-helm
        chart: argo-cd
        version: "{{ argocd_chart_version }}"
        targetNamespace: argocd
        createNamespace: true


- name: Execute K3s installation script
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s

- name: Ensure K3s service is running and enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: yes

- name: Create ArgoCD Application to link GitHub repository
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/argocd-github-link.yaml
    owner: root
    group: root
    mode: '0644'
    content: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: test-workload
        namespace: argocd
      spec:
        project: default
        source:
          # Note: If your repo is private, we will need to add a credential/token later. 
          # For a public repo, this works out of the box.
          repoURL: 'https://github.com/atrisko/k3s-homelab-migration.git'
          path: 'k8s/test-workload'
          targetRevision: HEAD
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: default
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
    